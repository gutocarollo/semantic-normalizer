[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-normalizer"
version = "0.2.0"
description = "Reversible English-Portuguese concept canonicalization for lexical retrieval"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Semantic Normalizer contributors" }]
dependencies = []

[project.optional-dependencies]
agent = [
  "instructor>=1.7",
  "pydantic>=2.8",
]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
semantic-normalizer = "semantic_normalizer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.setuptools.package-data]
semantic_normalizer = ["data/*.json"]
